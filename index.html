<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>いきものはかせ にんていしょ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Hiragino Maru Gothic ProN", "BIZ UDGothic", sans-serif;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .card {
    background: #FFFBF2;
    border: 2px solid #C8E6C9;
    border-radius: 24px;
    padding: 28px 32px;
    text-align: center;
    max-width: 360px;
    width: 90%;
    box-shadow: 0 4px 20px rgba(46,125,50,0.10);
  }
  .badge {
    font-size: 52px;
    line-height: 1;
    margin-bottom: 12px;
    display: block;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  h1 { font-size: 20px; color: #1B5E20; font-weight: 700; margin-bottom: 6px; }
  p { font-size: 13px; color: #888; margin-bottom: 22px; line-height: 1.7; }
  .dl-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: #2E7D32;
    color: #fff;
    font-family: inherit;
    font-size: 17px;
    font-weight: 700;
    padding: 14px 32px;
    border-radius: 999px;
    text-decoration: none;
    transition: transform 0.15s, background 0.15s;
    box-shadow: 0 4px 14px rgba(46,125,50,0.30);
  }
  .dl-btn:hover { background: #1B5E20; transform: translateY(-2px); }
  .dl-btn:active { transform: scale(0.96); }
  .dl-icon { font-size: 22px; }
  .note { margin-top: 14px; font-size: 11px; color: #aaa; }
</style>
</head>
<body>
<div class="card">
  <span class="badge">🏅</span>
  <h1>いきものはかせ にんていしょ</h1>
  <p>いきものをたいせつにしながら、<br>いきものについてしることはできた人は<br>下のボタンをクリックしてください。</p>
  <a class="dl-btn" href="ninteisho.pdf" download="生きものはかせ認定証.pdf">
    <span class="dl-icon">🏅</span>
    がんばった！
  </a>
  <div class="note">PDF形式・印刷してつかってね</div>
</div>
</body>
</html>
